<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STUTPAY – Campus Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#141b34;--line:#243056;--tx:#eef2ff;--mu:#93a0c8;--g:#18c26a;--y:#fcd116;--r:#ce1126;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--g),#0e9f55);color:#04140a;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #18c26a55}
.btn.alt{background:#1d2748;color:var(--tx)}.btn.wa{background:#25d366}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0e1530;margin:6px 0 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
label{font-size:13px;color:var(--mu)}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
#bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.bg{position:absolute;inset:0;background:linear-gradient(120deg,#07122e,#0b3b2a,#2a0a14,#07122e);background-size:300% 300%;animation:mv 14s ease infinite}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:fl 9s ease-in-out infinite}
@keyframes mv{50%{background-position:100% 50%}}@keyframes fl{50%{transform:translate(40px,-50px) scale(1.2)}}
.box{position:relative;width:min(430px,100%);background:#0b1020c9;backdrop-filter:blur(18px);border:1px solid #ffffff25;border-radius:24px;padding:30px;animation:up .6s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.logo{font-weight:800;font-size:32px;letter-spacing:1px}.logo b{color:var(--g)}.logo i{font-style:normal;color:var(--y)}
.tabs{display:flex;gap:6px;background:#0e1530;padding:5px;border-radius:14px;margin:18px 0}
.tabs button{flex:1;border:0;background:0;padding:10px;border-radius:10px;cursor:pointer;color:var(--mu);font-weight:700}
.tabs .on{background:var(--g);color:#04140a}
.err{color:#ff7b8a;font-size:13px;min-height:18px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:12px 20px;background:#0b1020ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav .logo{font-size:22px}.sp{flex:1}
.pill{background:#1d2748;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--y)}
.nt{display:flex;gap:4px;flex-wrap:wrap}.nt button{border:0;background:0;color:var(--mu);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700}
.nt .on,.nt button:hover{background:#1d2748;color:var(--tx)}
main{max-width:1100px;margin:auto;padding:24px 18px 60px}
.hero{border-radius:22px;padding:34px;background:linear-gradient(135deg,#0e9f55,#0b3b6b 60%,#6a0f1e);margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.hero p{margin:0;opacity:.9}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.bar input,.bar select{flex:1;min-width:150px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.25s;animation:up .5s}
.card:hover{transform:translateY(-6px);border-color:var(--g);box-shadow:0 14px 34px #0008}
.img{height:170px;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,#1d2748,#0e9f5540);background-size:cover;background-position:center}
.cb{padding:14px}.cb h3{margin:0 0 4px;font-size:16px}.price{color:var(--y);font-weight:800;font-size:20px}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:#18c26a22;color:var(--g);font-weight:700;margin-right:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:620px}
.spot{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
.spot span{font-size:26px}
.vb{padding:12px;border-radius:12px;margin-bottom:14px;font-weight:700}
.ok{background:#18c26a22;color:var(--g)}.pen{background:#fcd11622;color:var(--y)}.no{background:#ce112622;color:#ff7b8a}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#04140a;padding:12px 20px;border-radius:12px;font-weight:700;z-index:9;opacity:0;pointer-events:none;transition:.3s}
#toast.s{opacity:1}
#cam{position:fixed;inset:0;z-index:20;background:#000d;display:grid;place-items:center;padding:16px}
.cm{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;width:min(420px,100%);text-align:center}
.vw{position:relative;width:min(300px,100%);aspect-ratio:1;margin:12px auto;border-radius:50%;background:#000}
.vw video{width:100%;height:100%;object-fit:cover;border-radius:50%;transform:scaleX(-1)}
.ring{position:absolute;inset:-6px;border-radius:50%;border:4px dashed #fff;animation:rot 8s linear infinite}
.ring.good{border:4px solid var(--g)}.ring.bad{border:4px solid var(--r)}
@keyframes rot{to{transform:rotate(360deg)}}
.ins{font-weight:800;min-height:48px;margin:8px 0}.prog{display:flex;gap:8px;justify-content:center;margin-bottom:12px}.prog i{width:34px;height:6px;border-radius:9px;background:#243056}.prog i.d{background:var(--g)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--mu);font-size:13px}.stat b{font-size:28px;color:var(--y);display:block}
.rq{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.ims{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.ims figure{margin:0;width:150px}.ims img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}.ims img.big{position:fixed;inset:5%;width:90%;height:90%;object-fit:contain;z-index:30;background:#000;cursor:zoom-out}.ims figcaption{font-size:11px;color:var(--mu)}
.hs{position:relative;border-radius:24px;overflow:hidden;margin-bottom:22px;min-height:240px}
.sd{position:absolute;inset:0;padding:34px;display:flex;flex-direction:column;justify-content:center;gap:8px;opacity:0;transform:translateX(30px);transition:.7s;background:linear-gradient(120deg,hsl(var(--h) 70% 32%),hsl(calc(var(--h) + 50) 70% 16%));background-size:cover;background-position:center}
.sd.on{opacity:1;transform:none}.sd h1{margin:0;font-size:clamp(24px,4vw,40px)}.sd p{margin:0 0 8px;opacity:.9;max-width:460px}.sd .btn{align-self:flex-start}
.dots{position:absolute;bottom:14px;left:34px;display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:9px;background:#fff6;transition:.3s}.dots i.on{width:24px;background:#fff}
.cnt{position:absolute;right:26px;bottom:18px;display:flex;gap:20px;font-size:12px;color:#fffc}.cnt b{display:block;font-size:28px;color:var(--y)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:700;color:var(--tx);transition:.2s}
.chip:hover{border-color:var(--g);transform:translateY(-2px)}.chip.on{background:var(--g);color:#04140a;border-color:var(--g)}
.sec{margin:22px 0 12px;font-size:20px}.sec .mu{font-size:13px;font-weight:400}
.strip{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}.strip .card{flex:none;width:220px;scroll-snap-align:start}
.pc{cursor:pointer;position:relative}.im{position:relative;height:190px;overflow:hidden}
.art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background-size:cover!important;background-position:center!important;transition:transform .5s}
.pc:hover .art{transform:scale(1.08)}
.art span{font-size:68px;filter:drop-shadow(0 10px 14px #0006);animation:bob 4s ease-in-out infinite;position:relative}
.art i{position:absolute;width:140px;height:140px;border-radius:50%;background:#ffffff14;top:-30px;right:-30px}.art i+i{width:90px;height:90px;top:auto;right:auto;left:-20px;bottom:-20px}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.pc .im::after{content:"👀 Quick view";position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;font-weight:700;font-size:13px;background:linear-gradient(transparent,#000b);transform:translateY(100%);transition:.3s}.pc:hover .im::after{transform:none}
.heart{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:#0b1020b3;color:#fff;font-size:18px;cursor:pointer;z-index:2;transition:.2s}
.heart:hover{transform:scale(1.15)}.heart.on{color:#ff4d6d;animation:pop .35s}@keyframes pop{50%{transform:scale(1.45)}}
.nw,.so{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:99px;font-size:11px;z-index:2}.nw{background:var(--y);color:#222}.so{background:var(--r);color:#fff}.sold .art{filter:grayscale(1);opacity:.6}
.sl{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}.sl .mu{margin-left:auto;font-size:11px}
.av{width:28px;height:28px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--y));color:#04140a;display:grid;place-items:center;font-weight:800;font-size:12px}.sl em{color:var(--g);font-style:normal}
.sk{height:320px;background:linear-gradient(90deg,var(--card) 25%,#1d2748 50%,var(--card) 75%);background-size:200%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
#mp{max-width:140px}.empty{grid-column:1/-1;text-align:center;padding:40px;font-size:40px}
#mod{position:fixed;inset:0;z-index:15;background:#000b;display:grid;place-items:center;padding:14px;animation:fd .25s}@keyframes fd{from{opacity:0}}
.md{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;width:min(880px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;animation:up .35s}
.x{position:absolute;top:12px;right:12px;z-index:3;border:0;width:36px;height:36px;border-radius:50%;background:#0b1020;color:#fff;cursor:pointer}
.main{position:relative;height:340px;overflow:hidden}.th{display:flex;gap:8px;padding:10px}.th img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer}.th img.on{border-color:var(--g)}
.inf{padding:24px;display:flex;flex-direction:column;gap:12px}.inf h2{margin:0}.price.big{font-size:32px}.sc{display:flex;gap:12px;align-items:center;background:#0e1530;border-radius:14px;padding:12px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:99px;box-shadow:0 10px 30px #18c26a66;padding:14px 22px}
#pv{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}#pv img{width:72px;height:72px;object-fit:cover;border-radius:12px}
a.spot{text-decoration:none;color:inherit;align-items:center;transition:.2s}a.spot:hover{transform:translateX(6px);border-color:var(--g)}a.spot em{margin-left:auto;font-style:normal;color:var(--g);font-weight:700;white-space:nowrap}
@media(max-width:700px){.md{grid-template-columns:1fr}.main{height:240px}.cnt{display:none}}
#app{background:radial-gradient(900px 500px at 10% -10%,#18c26a22,transparent),radial-gradient(800px 500px at 100% 0,#fcd11616,transparent),var(--bg)}
#wall{position:absolute;inset:-20% -10%;display:flex;justify-content:center;gap:18px;transform:rotate(-8deg);opacity:.6;pointer-events:none}
.col{display:flex;flex-direction:column;width:200px;animation:scr linear infinite}@keyframes scr{to{transform:translateY(-50%)}}
.wc{width:200px;background:#141b34cc;border:1px solid #ffffff22;border-radius:16px;padding:10px;margin-bottom:16px}.wi{height:120px;border-radius:12px;display:grid;place-items:center;margin-bottom:8px;background-size:cover!important;background-position:center!important;position:relative}.wi svg{display:none}.wi::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#0008);border-radius:12px}.wc b{display:block;font-size:13px}.wc em{font-style:normal;color:var(--g);font-size:11px}
.shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#0b102000,#0b1020d0 85%);pointer-events:none}
.cap{position:absolute;left:5%;bottom:8%;width:min(430px,40%);height:80px}.cap .c{position:absolute;bottom:0;left:0;display:flex;gap:14px;align-items:center;opacity:0;animation:cp 20s infinite;animation-delay:var(--d)}
.cap svg{width:60px;height:60px;flex:none;background:var(--g);border-radius:16px;padding:10px}.cap h2{margin:0;font-size:24px}.cap p{margin:2px 0 0;color:#cdd6f6;font-size:14px}
@keyframes cp{0%{opacity:0;transform:translateY(20px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-14px)}}
.bub{position:absolute;right:5%;bottom:10%;width:min(300px,28%);display:flex;flex-direction:column;gap:10px}.bub div{padding:12px 16px;border-radius:18px;font-size:14px;opacity:0;animation:bp 10s infinite}
.b1{background:#fff;color:#111;border-bottom-left-radius:4px}.b2{background:#25d366;color:#04140a;align-self:flex-end;border-bottom-right-radius:4px;animation-delay:2s!important}
@keyframes bp{0%{opacity:0;transform:scale(.8)}6%,70%{opacity:1;transform:none}80%,100%{opacity:0}}
.art span svg{width:92px;height:92px;display:block}
.sd.ad{background-size:cover;background-position:center}.spn{position:absolute;top:12px;right:14px;font-size:10px;letter-spacing:1px;background:#0007;padding:3px 9px;border-radius:99px}
.dec{position:absolute;right:30px;top:26px;display:flex;gap:14px}.dec svg{width:84px;height:84px;animation:bob 4s ease-in-out infinite}.dec svg:nth-child(2){animation-delay:-1.3s}.dec svg:nth-child(3){animation-delay:-2.6s}
.adt{grid-column:1/-1;min-height:140px;border-radius:18px;padding:24px;position:relative;overflow:hidden;background:linear-gradient(120deg,hsl(var(--h,200) 70% 30%),hsl(calc(var(--h,200) + 60) 70% 16%));background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:center}
.adt h3{margin:0;font-size:22px}.adt p{margin:4px 0 0;opacity:.9}.dec2 svg{position:absolute;right:24px;bottom:10px;width:110px;opacity:.85}
@media(max-width:900px){.cap,.bub,.dec{display:none}}
.sg{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}.pvw{position:sticky;top:90px}.ck{display:flex;gap:10px;align-items:center;margin-bottom:12px;color:var(--tx);font-size:14px}.ck input{width:auto;margin:0}@media(max-width:800px){.sg{grid-template-columns:1fr}.pvw{position:static}}
.real-badge{position:absolute;left:10px;bottom:10px;background:#000a;color:#fff;font-size:10px;padding:4px 8px;border-radius:99px;font-weight:700;letter-spacing:.5px;z-index:2}
.main .art{height:100%;background-size:cover!important;background-position:center!important}
</style></head><body>

<section id="auth">
 <video id="bgv" autoplay muted loop playsinline></video>
 <div class="bg"></div>
 <div class="orb" style="width:300px;height:300px;background:#18c26a;top:5%;left:8%"></div>
 <div class="orb" style="width:260px;height:260px;background:#fcd116;bottom:8%;right:10%;animation-delay:-3s"></div>
 <div class="orb" style="width:240px;height:240px;background:#ce1126;top:50%;left:55%;animation-delay:-6s"></div>
 <div id="wall"></div><div class="shade"></div>
 <div class="cap" id="cap"></div>
 <div class="bub"><div class="b1">Hi! Is the laptop still available?</div><div class="b2">Yes! Let us meet at the library at 12.</div></div>
 <div class="box">
  <div class="logo">STUT<b>PAY</b><i>●</i></div>
  <div class="mu">Buy &amp; sell safely with students at your campus</div>
  <div class="tabs"><button id="tl" class="on">Log in</button><button id="ts">Sign up</button></div>
  <div id="fl">
   <label>Email</label><input id="le" type="email" placeholder="you@school.edu.gh">
   <label>Password</label><input id="lp" type="password" placeholder="••••••••">
   <div class="err" id="lerr"></div><button class="btn" style="width:100%" id="lb">Log in</button>
  </div>
  <div id="fs" class="hide">
   <label>Full name</label><input id="sn">
   <label>University</label><select id="su"></select>
   <label>WhatsApp number</label><input id="sw" placeholder="024 123 4567">
   <label>Email</label><input id="se" type="email">
   <label>Password (min 6 characters)</label><input id="sp" type="password">
   <div class="err" id="serr"></div><button class="btn" style="width:100%" id="sb">Create account</button>
  </div>
 </div>
</section>

<section id="app" class="hide">
 <nav><div class="logo">STUT<b>PAY</b><i>●</i></div><span class="pill" id="uniP"></span>
  <div class="nt" id="nt"><button data-v="market" class="on">Marketplace</button><button data-v="saved">Saved ♥</button><button data-v="sell">Sell</button><button data-v="spots">Safe spots</button><button data-v="me">Profile</button><button data-v="admin" class="hide">Admin</button></div>
  <div class="sp"></div><button class="btn alt" id="out">Log out</button></nav>
 <main id="view"></main>
</section>
<div id="toast"></div>

<script>
const VIDEO_SRC="";
const UNIS=["University of Ghana (Legon)","KNUST","UCC","UEW","UDS","UMaT","UPSA","GIMPA","UHAS","Ashesi University","AAMUSTED","UENR"];
const CATS=["Electronics","Fashion","Books","Food","Beauty","Hostel items","Services","Other"];
const ICON={Electronics:"💻",Fashion:"👕",Books:"📚",Food:"🍲",Beauty:"💄","Hostel items":"🛏️",Services:"🛠️",Other:"📦"};
const REAL_IMGS={
  phone:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800&q=80",
  laptop:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800&q=80",
  speaker:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=800&q=80",
  earbuds:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=800&q=80",
  sneaker:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800&q=80",
  jacket:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=800&q=80",
  book:"https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=800&q=80",
  bowl:"https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=800&q=80",
  scissors:"https://images.unsplash.com/photo-1522337660859-02fbefca4702?w=800&q=80",
  fridge:"https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?w=800&q=80",
  lamp:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=800&q=80",
  basket:"https://images.unsplash.com/photo-1584589167171-541ce45f1eea?w=800&q=80",
  doc:"https://images.unsplash.com/photo-1455390582262-044cdead277a?w=800&q=80",
  palette:"https://images.unsplash.com/photo-1561070791-2526d30994b5?w=800&q=80",
  box:"https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=800&q=80",
  pin:"https://images.unsplash.com/photo-1524661135-423995f22d0b?w=800&q=80",
  shield:"https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=800&q=80",
  chat:"https://images.unsplash.com/photo-1611606063065-ee7946f0787a?w=800&q=80",
  tag:"https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800&q=80",
  campus:"https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=1200&q=80",
  students:"https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=1200&q=80",
  market:"https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1200&q=80"
};
const DEF_SPOTS=["Main library entrance (busy, well lit)","Campus security post / main gate","Students’ centre or SRC building","Main canteen / food court area"];
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem={};

  const G=[["Photo 1 of 3","Look straight at the camera, whole face visible"],["Photo 2 of 3","Turn your head to the LEFT, then take the photo"],["Photo 3 of 3","Turn your head to the RIGHT, then take the photo"]],out=[];

   B.querySelector("input").onchange=async e=>{const f=e.target.files[0];if(!f)return;out.push(await shrink(f,360));step(i+1)};

  step(0)}
 async function live(){
  B.innerHTML='<div class="vw"><video playsinline muted></video><div class="ring" id="rg"></div></div><div class="ins" id="ins">Starting camera…</div><div class="prog" id="pg"></div>';
  const v=B.querySelector("video"),ins=B.querySelector("#ins"),rg=B.querySelector("#rg"),pg=B.querySelector("#pg");
  let fd=null;try{if("FaceDetector" in window)fd=new FaceDetector({fastMode:true,maxDetectedFaces:1})}catch{}
  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});v.srcObject=stream;await v.play()}catch{return guided()}
  const snap=()=>{const c=document.createElement("canvas");c.width=320;c.height=240;c.getContext("2d").drawImage(v,0,0,320,240);return c.toDataURL("image/jpeg",.65)};
  const mc=document.createElement("canvas");mc.width=32;mc.height=24;const mx=mc.getContext("2d",{willReadFrequently:true});let prev=null;
  const motion=()=>{mx.drawImage(v,0,0,32,24);const d=mx.getImageData(0,0,32,24).data;let s=0;if(prev)for(let k=0;k<d.length;k+=16)s+=Math.abs(d[k]-prev[k]);prev=d.slice();return s/(d.length/16)};
  const pose=async()=>{if(!fd)return{face:true,yaw:0};
   try{const f=(await fd.detect(v))[0];if(!f)return{face:false,yaw:0};const b=f.boundingBox;let yaw=((b.x+b.width/2)/v.videoWidth-.5)*2;
    const L=f.landmarks||[],e=L.filter(l=>l.type==="eye"),n=L.find(l=>l.type==="nose");
    if(e.length===2&&n){const a=e[0].locations[0].x,c=e[1].locations[0].x;yaw=(n.locations[0].x-(a+c)/2)/(Math.abs(a-c)||1)}
    return{face:true,yaw}}catch{return{face:true,yaw:0}}};
  const S=[["Place your face inside the circle","c"],["Slowly turn your head to the LEFT","t"],["Now slowly turn your head to the RIGHT","t"],["Look straight at the camera","c"]],out=[];let s1=0;
  for(let i=0;i<S.length&&!stop;i++){
   pg.innerHTML=S.map((_,j)=>'<i class="'+(j<i?"d":"")+'"></i>').join("");ins.textContent=S[i][0];
   let ok=false,t0=Date.now(),mv=0,hold=0;
   while(!stop&&Date.now()-t0<15000){
    const p=await pose();if(motion()>4)mv++;

   if(stop)return;
   if(!ok){ins.textContent="We could not detect that. Try again in good lighting.";rg.className="ring bad";await sleep(1800);end();toast("Live check failed, please try again");return}
   rg.className="ring good";if(i<3)out.push(snap());await sleep(600);rg.className="ring"}
